<!DOCTYPE html>
<html data-theme="light">
<head>
    <title>Banner diff tool</title>
    <link rel="stylesheet" href="https://www.mediawiki.org/w/load.php?modules=mediawiki.diff.styles&only=styles">
    <script src="https://tools-static.wmflabs.org/cdnjs/ajax/libs/jquery/3.6.0/jquery.min.js"></script>
    <style>
        @media (prefers-reduced-motion) {
            * {
                transition-duration: 0s !important;
            }
        }
        :root {
            --preview-width: auto;
            --preview-height: auto;
            --preview-scale: 1;
            --preview-scale-zoomed: 1;
        }

        /* Default MediaWiki styles */
        [data-theme="light"] {
            --color-base: #fff;
            --color-text: #000;
            --color-accent: #36c;
            --color-accent-2: #447ff5;
            --color-surface-0: #f8f9fa;
            --color-surface-1: #eee;
            --color-subtext-0: #222;
            --color-yellow: #ffe49c;
            --color-sapphire: #d8ecff;
            --color-text-highlighted: var(--color-text);
        }
        
        /* Dark colors from Catppuccin Machiatto https://catppuccin.ryanccn.dev/palette */
        [data-theme="dark"] {
            --color-base: #24273a;
            --color-text: #cad3f5;
            --color-accent: #8aadf4;
            --color-accent-2: #447ff5;
            --color-surface-0: #363a4f;
            --color-surface-1: #494d64;
            --color-subtext-0: #b8c0e0;
            --color-yellow: #eed49f;
            --color-sapphire: #7dc4e4;
            --color-text-highlighted: var(--color-base);
        }

        .diff-context {
            background: var(--color-surface-0);
            border-color: var(--color-surface-1);
            color: var(--color-subtext-0);
        }
        .diff-deletedline {
            border-color: var(--color-yellow);
        }
        .diff-deletedline .diffchange {
            background: var(--color-yellow);
        }
        .diff-addedline {
            border-color: var(--color-sapphire);
        }
        .diff-addedline .diffchange {
            background: var(--color-sapphire);
        }
        .diffchange {
            color: var(--color-text-highlighted);
        }

        body {
            font-family: sans-serif;
            overflow-y: scroll;
            text-align: center;
            line-height: 1.4;
            background: var(--color-base);
            color: var(--color-text);
        }
        a {
            color: var(--color-accent);
        }
        a:hover {
            color: var(--color-accent-2);
        }

        #settings a,
        #header-row a {
            padding: 2px 4px;
        }

        #settings {
            margin-bottom: 1em;
        }

        #settings input[type="text"] {
            background: var(--color-surface-0);
            color: var(--color-text);
            border: 1px solid;
        }

        .diff {
            text-align: left;
        }

        #header-row {
            height: 4.5em;
        }
        #header-banner1,
        #header-banner2 {
            position: absolute;
            /* transition: left 0.3s; */
        }
        #title-banner1,
        #title-banner2 {
            font-weight: bold;
        }

        body.live-preview-enabled #enable-live-preview,
        body:not(.live-preview-enabled) #disable-live-preview,
        body:not(.zoomed-banner1, .zoomed-banner2) #zoom-both,
        .zoomed-banner1 #zoom-banner1,
        .zoomed-banner2 #zoom-banner2 {
            color: #fff;
            background-color: var(--color-accent);
            text-decoration: none;
            pointer-events: none;
        }

        .preview-settings {
            display: flex;
            justify-content: center;
            gap: 16px;
            margin: 4px 0;
        }

        input:disabled+label {
            opacity: 0.4;
        }

        .live-preview-settings {
            visibility: hidden;
        }
        .live-preview-enabled .live-preview-settings {
            visibility: visible;
        }

        .scale {
            display: inline-block;
            font-size: small;
            min-width: 7em;
        }

        #scale-amount-zoomed {
            display: none;
        }
        .zoomed-banner1 #scale-amount,
        .zoomed-banner2 #scale-amount {
            display: none;
        }
        .zoomed-banner1 #scale-amount-zoomed,
        .zoomed-banner2 #scale-amount-zoomed {
            display: inline;
        }

        .live-preview-enabled #diff-element { display: none; }

        .zoom-link { display: none; }
        .live-preview-enabled .zoom-link { display: inline; }

        #live-preview-row { 
            display: none;
            height: calc(var(--preview-height) * var(--preview-scale));
            margin-bottom: 40px;
        }
        .zoomed-banner1 #live-preview-row,
        .zoomed-banner2 #live-preview-row {
            height: calc(var(--preview-height) * var(--preview-scale-zoomed));
        }
        .live-preview-enabled #live-preview-row { display: block; }

        #header-banner1,
        #live-preview-banner1 {
            left: 25%;
            translate: -50%;
        }

        #header-banner2,
        #live-preview-banner2 {
            left: 75%;
            translate: -50%;
        }

        iframe {
            position: absolute;
            margin: 0 auto;
            border: 1px solid #000;
            transform-origin: 50% 0;
            /* transition: left 0.3s, transform 0.3s; */
            width: var(--preview-width);
            height: var(--preview-height);
            transform: scale( var(--preview-scale) );
        }

        .zoomed-banner1 iframe,
        .zoomed-banner2 iframe {
            left: 50% !important;
            transform: scale( var(--preview-scale-zoomed) );
        }

        .zoomed-banner1 #header-banner1,
        .zoomed-banner2 #header-banner2 {
            left: 50%;
        }

        .zoomed-banner1 #live-preview-banner2,
        .zoomed-banner1 #header-banner2 {
            display: none;
            /* left: 125%; */
        }
        .zoomed-banner2 #live-preview-banner1,
        .zoomed-banner2 #header-banner1 {
            display: none;
            /* left: -25%; */
        }

        .theme-toggle {
            position: absolute;
            top: 0;
            right: 0;
            padding: 8px;
            margin: 8px;
            border: 0;
            border-radius: 50%;
            display: flex;
            cursor: pointer;
            color: var(--color-yellow);
            background: #6e738d;
        }
        .theme-toggle:hover {
            filter: brightness(1.2);
        }
        .theme-toggle svg {
            fill: currentColor;
        }

        [data-theme="light"] #enable-light-theme,
        [data-theme="dark"] #enable-dark-theme {
            display: none;
        }
    </style>
</head>
<body>
    <button id="enable-light-theme" class="theme-toggle" aria-label="Light theme">
        <svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="20" height="20" viewBox="0 0 20 20" aria-hidden="true"><g><path d="M17.07 7.07V2.93h-4.14L10 0 7.07 2.93H2.93v4.14L0 10l2.93 2.93v4.14h4.14L10 20l2.93-2.93h4.14v-4.14L20 10zM10 16a6 6 0 116-6 6 6 0 01-6 6"></path><circle cx="10" cy="10" r="4.5"></circle></g></svg>
    </button>
    <button id="enable-dark-theme" class="theme-toggle" aria-label="Dark theme">
        <svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="20" height="20" viewBox="0 0 20 20" aria-hidden="true"><g><path d="M17.39 15.14A7.33 7.33 0 0111.75 1.6c.23-.11.56-.23.79-.34a8.2 8.2 0 00-5.41.45 9 9 0 107 16.58 8.42 8.42 0 004.29-3.84 5.3 5.3 0 01-1.03.69"></path></g></svg>
    </button>
    <div id="settings">
        <a href="#" id="disable-live-preview">Diff (d)</a> / <a href="#" id="enable-live-preview">Preview (p)</a>
        <div class="preview-settings">
            <strong>Preview settings:</strong>
            <span>
                <label for="language-select">Language</label>
                <input id="language-select" type="text" size="2" />
            </span>
            <span>
                <label for="country-select">Country</label>
                <input id="country-select" type="text" size="2" oninput="this.value = this.value.toUpperCase()" />
            </span>
            <span>
                <input id="force-apple-pay" type="checkbox" />
                <label for="force-apple-pay">Force Apple Pay</label>
            </span>
            <span>
                <input id="preview-night-mode" type="checkbox" />
                <label for="preview-night-mode">Night mode</label>
            </span>
        </div>
        <div class="live-preview-settings">
            <select id="preview-size-select">
                <option value="345x883">345x883 - Galaxy Z Fold 5 (front)</option>
                <option value="384x824">384x824 - Galaxy S22 Ultra</option>
                <option value="412x915">412x915 - Galaxy A51</option>
                <option value="753x1205">753x1205 - Galaxy Tab S8</option>
                <option value="384x854">384x854 - OnePlus 9</option>
                <option value="360x780">360x780 - Huawei P30</option>
                <hr>
                <option value="375x667">375x667 - iPhone SE 2020</option>
                <option value="414x896">414x896 - iPhone 11 Pro Max</option>
                <option value="390x844">390x844 - iPhone 13</option>
                <option value="430x932">430x932 - iPhone 15 Plus</option>
                <option value="744x1133">744x1133 - iPad Mini 2021</option>
                <hr>
                <option value="1920x1080">1920x1080</option>
                <option value="1366x768">1366x768</option>
                <option value="1536x864">1536x864</option>
                <option value="1280x720">1280x720</option>
                <option value="1440x900">1440x900</option>
                <option value="2560x1440">2560x1440</option>
            </select>
            (r)
            <span class="scale">
                Scale: <span id="scale-amount"></span><span id="scale-amount-zoomed"></span>×
            </span>
            <span class="zoom-settings">
                Zoom: <a href="#" id="zoom-both">Both (0)</a> <a href="#" id="zoom-banner1">Banner 1 (1)</a> <a href="#" id="zoom-banner2">Banner 2 (2)</a>
            </span>
        </div>
    </div>
    <div id="header-row">
        <div id="header-banner1">
            <div id="title-banner1"></div>
            <div><span id="size-banner1"></span></div>
            <div class="header-links">
                <a id="edit-banner1">Edit</a>
                <a id="preview-banner1">On-site preview</a>
            </div>
        </div>
        <div id="header-banner2">
            <div id="title-banner2"></div>
            <div><span id="size-banner2"></span> <span id="size-change"></span></div>
            <div class="header-links">
                <a id="edit-banner2">Edit</a>
                <a id="preview-banner2">On-site preview</a>
            </div>
        </div>
    </div>
    <table class="diff">
        <colgroup>
            <col class="diff-marker">
            <col class="diff-content">
            <col class="diff-marker">
            <col class="diff-content">
        </colgroup>
        <tbody id="diff-element">
        </tbody>
    </table>
    <div id="live-preview-row">
        <iframe id="live-preview-banner1" credentialless allow="payment"></iframe>
        <iframe id="live-preview-banner2" credentialless allow="payment"></iframe>
    </div>
    <div id="status">Loading...</div>

<script>
(function() {

    /**
     * Lock selection to one side at a time
     * From resources/src/mediawiki.diff.styles/diff.js
     */
    $( function setDiffSideProtection() {
        /**
         * @param {Node} node
         * @return {string|undefined}
         * @ignore
         */
        function getNodeSide( node ) {
            if ( $( node ).closest( '.diff-side-deleted' ).length !== 0 ) {
                return 'deleted';
            } else if ( $( node ).closest( '.diff-side-added' ).length !== 0 ) {
                return 'added';
            } else {
                // Not inside the diff.
                return undefined;
            }
        }

        /**
         * @return {string|undefined}
         * @ignore
         */
        function getCurrentlyLockedSide() {
            return $( '.diff' ).attr( 'data-selected-side' );
        }

        /**
         * @param {string|undefined} side Either "added" or "deleted", or undefined to unset.
         * @ignore
         */
        function setSideLock( side ) {
            $( '.diff' ).attr( 'data-selected-side', side );
        }

        /**
         * @param {MouseEvent} e
         * @ignore
         */
        function maybeClearSelectProtection( e ) {
            if ( e.button === 2 ) {
                // Right click.
                return;
            }
            var clickSide = getNodeSide( e.target );
            if ( getCurrentlyLockedSide() !== clickSide ) {
                document.getSelection().removeAllRanges();
            }
            setSideLock( clickSide );
        }

        function selectionHandler() {
            var textNode = document.getSelection().anchorNode;

            if ( !textNode ) {
                return;
            }

            setSideLock( getNodeSide( textNode ) );
        }

        $( document ).on( 'selectionchange', selectionHandler );
        $( document ).on( 'mousedown', maybeClearSelectProtection );
    } );


    /**
     * This gets a lot of info (more than we need), but breaks for less standard names
     * But keep it around as it might be useful starting point for future projects
     * @param  {string} bannerName
     * @return {object}
     */
    function parseBannerName( bannerName ) {
        let trimmedName = bannerName.match(/B\d\d\d\d.*/)[0]; // remove user name from start
        let x = trimmedName.split('_');
        let bannerData = {
            fiscal: 'FY' + x[0].substring(1,3) + '–' + x[0].substring(3,5),
            mmdd: x[1].substring(0,4),
            language: x[2].substring(0,2),
            country: x[2].substring(2,4),
            device: x[3],
            size: x[5],
            testType: x[6],
            testVariant: x[7]
        }
        if ( bannerName.includes('_m_') ) {
            bannerData.device = 'm';
        }
        return bannerData;
    }

    /**
     * Regex-based name parser. Gives less info but hopefully more reliable
     * @param  {string} bannerName
     * @return {object}
     */
    function newParseBannerName( bannerName ) {
        let bannerData = {};
        try {
            let langCountry = bannerName.match( /_([a-z]{2,})([0-9A-Z]{2,})_/ );
            if ( langCountry ) {
                bannerData.language = langCountry[1];
                bannerData.country = langCountry[2];
            }
            if ( bannerName.match( /_m_|_mob_|_ipd_/ ) ) {
                bannerData.device = 'm';
            } else {
                bannerData.device = 'dsk';
            }
        } catch {
            console.warn('Error parsing banner name, using default values')
            bannerData.language = 'en';
            bannerData.country = 'GB';
            bannerData.device = 'dsk';
        }
        return bannerData;
    }

    function editUrl( bannerName ) {
        return 'https://meta.wikimedia.org/wiki/Special:CentralNoticeBanners/Edit/' + bannerName;
    }

    // TODO: split this out into a module
    function previewUrl( bannerName, options = {} ) {
        var url;

        // Norwegian is weird, language code is nb but wiki is at no.wikipedia.org
        if ( options.language === 'nb' ) {
            options.language = 'no';
        }

        if ( options.device === 'm' ) {
            url = `https://${options.language}.m.wikipedia.org/wiki/${options.article}?country=${options.country}&banner=${bannerName}`;
        } else {
            url = `https://${options.language}.wikipedia.org/wiki/${options.article}?country=${options.country}&banner=${bannerName}`;
        }

        if ( options.forceApplePay ) {
            url += '&forceApplePay=1';
        }
        if ( options.nightMode && options.device === 'm' ) {
            url += '&minervanightmode=1';
        }

        return url;
    }

    var bodyClasses = document.body.classList,
        diffElement = document.getElementById('diff-element'),
        statusElement = document.getElementById('status'),
        urlParams = new URLSearchParams(window.location.search),
        banner1 = urlParams.get('banner1'),
        banner2 = urlParams.get('banner2'),
        editLink = 'https://meta.wikimedia.org/wiki/Special:CentralNoticeBanners/Edit/',
        apiEndpoint = 'https://meta.wikimedia.org/w/api.php',
        params = 'origin=*&action=compare&format=json&prop=diff|size',
        bannerPagePrefix = 'MediaWiki:Centralnotice-template-',
        previewOptions,
        languageSelect = document.getElementById('language-select'),
        countrySelect = document.getElementById('country-select'),
        previewSizeSelect = document.getElementById('preview-size-select'),
        diffContent, fromSize, toSize, sizeChange;

    params += '&fromtitle=' + bannerPagePrefix + banner1;
    params += '&totitle=' + bannerPagePrefix + banner2;

    document.getElementById( 'title-banner1' ).innerText = banner1;
    document.getElementById( 'title-banner2' ).innerText = banner2;

    document.getElementById( 'edit-banner1' ).setAttribute( 'href', editUrl( banner1 ) );
    document.getElementById( 'edit-banner2' ).setAttribute( 'href', editUrl( banner2 ) );

    // Get initial preview options
    previewOptions = newParseBannerName( banner2 );
    if ( previewOptions.language === 'ml' ) {
        previewOptions.language = 'en';
    }
    if ( previewOptions.country === '6C' || previewOptions.country === 'WW' ) {
        previewOptions.country = 'GB'
    } else if ( previewOptions.country === 'LA' ) {
        previewOptions.country = 'AR';
    }
    previewOptions.article = 'NASA';

    languageSelect.value = previewOptions.language;
    languageSelect.addEventListener( 'change', (e) => {
        previewOptions.language = languageSelect.value;
        updatePreviewUrls();
    });
    
    countrySelect.value = previewOptions.country;
    countrySelect.addEventListener( 'change', (e) => {
        previewOptions.country = countrySelect.value;
        updatePreviewUrls();
    });

    document.getElementById( 'force-apple-pay' ).addEventListener( 'change', (e) => {
        previewOptions.forceApplePay = e.target.checked;
        updatePreviewUrls();
    });

    // Only available on mobile for now
    if ( previewOptions.device !== 'm' ) {
        document.getElementById( 'preview-night-mode' ).disabled = true;
    }
    document.getElementById( 'preview-night-mode' ).addEventListener( 'change', (e) => {
        previewOptions.nightMode = e.target.checked;
        updatePreviewUrls();
    });

    updatePreviewUrls();

    if ( banner1 === banner2 ) {
        statusElement.innerHTML = 'Those are the same banner!';
        return;
    }

    fetch( apiEndpoint + '?' + params )
        .then(function(response) { return response.json(); } )
        .then(function(response) {
            try {
                diffContent = response.compare['*'];
                if ( diffContent.match(/<tr>/) ) {
                    diffElement.innerHTML = diffContent;
                    statusElement.remove();
                } else {
                    statusElement.innerHTML = 'No difference between banners.';
                }
                fromSize   = response.compare.fromsize;
                toSize     = response.compare.tosize;
                sizeChange = toSize - fromSize;
                document.getElementById('size-banner1').innerText = fromSize.toLocaleString() + ' bytes';
                document.getElementById('size-banner2').innerText = toSize.toLocaleString() + ' bytes';
                document.getElementById('size-change').innerText =
                    sizeChange.toLocaleString( undefined, { signDisplay: 'always' } );
            } catch {
                statusElement.innerHTML = 'Error getting diff. Do both banners exist?';
            }
        });
    
    document.getElementById( 'enable-live-preview' ).addEventListener( 'click', () => {
        enableLivePreview();
    });

    document.getElementById( 'disable-live-preview' ).addEventListener( 'click', () => {
        bodyClasses.remove( 'live-preview-enabled', 'zoomed-banner1', 'zoomed-banner2' );
    });

    previewSizeSelect.addEventListener( 'change', (e) => {
        setPreviewSize( previewSizeSelect.value );
    });

    window.addEventListener( 'resize', (e) => {
        setPreviewSize( previewSizeSelect.value );
    });

    // Set initial size
    if ( previewOptions.device === 'm' ) {
        previewSizeSelect.value = '390x844';
    } else {
        previewSizeSelect.value = '1280x720';
    }
    setPreviewSize( previewSizeSelect.value );

    document.getElementById( 'zoom-both' ).addEventListener( 'click', (e) => {
        bodyClasses.remove( 'zoomed-banner1', 'zoomed-banner2' );
    });
    document.getElementById( 'zoom-banner1' ).addEventListener( 'click', (e) => {
        bodyClasses.remove( 'zoomed-banner2' );
        bodyClasses.add( 'zoomed-banner1' );
    });
    document.getElementById( 'zoom-banner2' ).addEventListener( 'click', (e) => {
        bodyClasses.remove( 'zoomed-banner1' );
        bodyClasses.add( 'zoomed-banner2' );
    });

    function updatePreviewUrls() {

        var previewUrl1 = previewUrl( banner1, previewOptions ),
            previewUrl2 = previewUrl( banner2, previewOptions );

        document.getElementById( 'preview-banner1' ).setAttribute( 'href', previewUrl1 );
        document.getElementById( 'preview-banner2' ).setAttribute( 'href', previewUrl2 );

        if ( bodyClasses.contains( 'live-preview-enabled' ) ) {
            const previewFrame1 = document.getElementById( 'live-preview-banner1' );
            const previewFrame2 = document.getElementById( 'live-preview-banner2' );

            // Only do this if wasn't set already, to avoid repeated loads
            if ( previewFrame1.getAttribute( 'src' ) !== previewUrl1 ) {
                previewFrame1.setAttribute( 'src', previewUrl1 );
            }
            if ( previewFrame2.getAttribute( 'src' ) !== previewUrl2 ) {
                previewFrame2.setAttribute( 'src', previewUrl2 );
            }
        }
    }

    function enableLivePreview() {
        bodyClasses.add( 'live-preview-enabled' );
        updatePreviewUrls();
        setPreviewSize( previewSizeSelect.value );
    }

    function setPreviewSize( sizeString ) {
        const scaleLevels = [ 0.25, 0.3, 0.35, 0.4, 0.45, 0.5, 0.55, 0.6, 0.65, 0.7, 0.75, 0.8, 0.85, 0.9, 0.95, 1 ];
        const screenWidth = window.innerWidth;
        const availWidth = ( screenWidth / 2 ) - 40;
        let width, height, scale, scaleZoomed;

        [ width, height ] = sizeString.split('x');

        for (let i = scaleLevels.length; i >= 0; i--) {
            scale = scaleLevels[i];
            if ( width * scale < availWidth ) {
                break;
            }
        }
        scaleZoomed = Math.min( scale * 2, 1 );

        document.documentElement.style.cssText = `
            --preview-width: ${width}px;
            --preview-height: ${height}px;
            --preview-scale: ${scale};
            --preview-scale-zoomed: ${scaleZoomed};
        `

        document.getElementById('scale-amount').textContent = scale;
        document.getElementById('scale-amount-zoomed').textContent = scaleZoomed;

    }

    // Keyboard shortcuts
    document.addEventListener( 'keydown', (e) => {

        if ( e.target.tagName === 'INPUT' ) {
            return false;
        }

        const keyName = e.key;
        const livePreviewEnabled = bodyClasses.contains( 'live-preview-enabled' );
        switch (keyName) {
            case 'p':
                enableLivePreview();
                break;
            case 'd':
                bodyClasses.remove( 'live-preview-enabled', 'zoomed-banner1', 'zoomed-banner2' );
                break;
            case 'r':
                if ( livePreviewEnabled ) {
                    previewSizeSelect.showPicker();
                }
                break;
            case 'Escape':
            case '0':
                bodyClasses.remove( 'zoomed-banner1', 'zoomed-banner2' );
                break;
            case '1':
                if ( livePreviewEnabled ) {
                    bodyClasses.remove( 'zoomed-banner2' );
                    bodyClasses.toggle( 'zoomed-banner1' );
                }
                break;
            case '2':
                if ( livePreviewEnabled ) {
                    bodyClasses.remove( 'zoomed-banner1' );
                    bodyClasses.toggle( 'zoomed-banner2' );
                }
                break;            
            default:
                break;
        }

    });

    function setTheme( theme ) {
        document.documentElement.setAttribute( 'data-theme', theme );
    }

    document.getElementById('enable-dark-theme').addEventListener( 'click', function() {
        setTheme( 'dark' );
        localStorage.setItem( 'diffTheme', 'dark' );
    });
    document.getElementById('enable-light-theme').addEventListener( 'click', function() {
        setTheme( 'light' );
        localStorage.setItem( 'diffTheme', 'light' );
    });

    var localStorageTheme = localStorage.getItem( 'diffTheme' );
    if ( localStorageTheme ) {
        setTheme( localStorageTheme );
    } else if ( window.matchMedia( '(prefers-color-scheme: dark)' ).matches ) {
        setTheme( 'dark' );
    } else if ( window.matchMedia( '(prefers-color-scheme: light)' ).matches ) {
        setTheme( 'light' );
    }

})();
</script>
